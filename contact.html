    <main class="portfolio-container">

        <section class="portfolio-section" style="text-align: center;">
            <h2 class="sectiontitle">Get In Touch</h2>
            <p style="color: #a0a5b0; margin-top: 10px; margin-bottom: 40px; font-size: 16px;">
                Have a project in mind or looking to hire a web developer? Drop a message below!
            </p>
        </section>

        <div class="contact-container">
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="John Kengara" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="felix@example.com" required>
                </div>
                
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" placeholder="Type your message here..." required></textarea>
                </div>
                
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>

        <div class="social-links-container">
            <a href="mailto:johnkengara07@gmail.com">Email Me</a>

            <a href="https://wa.me/254743986398" target="_blank">WhatsApp Chat</a>
            
            <div style="margin-top: 25px; color: #a0a5b0; font-size: 15px;">

            </div>
